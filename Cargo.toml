[workspace]
resolver = "2"
members = [
    "crates/ipfrs",
    "crates/ipfrs-core",
    "crates/ipfrs-network",
    "crates/ipfrs-storage",
    "crates/ipfrs-transport",
    "crates/ipfrs-semantic",
    "crates/ipfrs-interface",
    "crates/ipfrs-tensorlogic",
    "crates/ipfrs-cli",
]
# Note: ipfrs-python is excluded from default members
# Build separately with: cd crates/ipfrs-python && maturin develop
exclude = ["crates/ipfrs-python"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TensorLogic Architect"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cool-japan/ipfrs"
homepage = "https://github.com/cool-japan/ipfrs"
rust-version = "1.90"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.49", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Networking (libp2p stack)
libp2p = { version = "0.56", features = ["tcp", "tokio", "quic", "noise", "yamux", "gossipsub", "kad", "identify", "ping", "macros", "autonat", "dcutr", "relay", "mdns", "rsa"] }
libp2p-quic = "0.13"
quinn = "0.11"

# Storage backends
sled = "0.34"
# parity-db = "0.4"  # Uncomment when needed

# IPLD and content addressing
cid = "0.11"
multihash = "0.19"
multihash-codetable = { version = "0.1", features = ["sha2", "sha3", "blake2b", "blake2s", "blake3"] }
multibase = "0.9"

# Zero-copy and serialization
arrow = { version = "57", features = ["ipc"] }
arrow-array = "57"
arrow-buffer = "57"
arrow-schema = "57"
safetensors = "0.7"
bytes = "1.11"
memmap2 = "0.9"
rand = "0.9"

# Vector search (HNSW)
# Using hnsw_rs as placeholder for semantic search
hnsw_rs = "0.3"

# Linear algebra (for OPQ rotation matrix learning)
nalgebra = "0.34"

# Cryptography
blake3 = "1.8"
sha2 = "0.10"
hex = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging and observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Distributed tracing
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry-otlp = { version = "0.31", features = ["tonic", "trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio", "trace"] }
tracing-opentelemetry = "0.32"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Web server
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = "1.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
oxicode = { version = "0.1", features = ["derive", "serde"] }
ciborium = "0.2"
base64 = "0.22"

# Utilities
dashmap = "6.1"
parking_lot = "0.12"
once_cell = "1.21"
lru = "0.16"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.11"

# Benchmarking
criterion = { version = "0.8", features = ["async_tokio"] }

# Testing
tempfile = "3.24"

# Property-based testing
proptest = "1.9"

# Authentication & Authorization
jsonwebtoken = { version = "10.2", default-features = false, features = ["rust_crypto"] }
bcrypt = "0.18"
uuid = { version = "1.19", features = ["v4", "serde"] }

# TLS/Crypto
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"

# Database
parity-db = "0.5"

# Additional networking
tokio-tungstenite = "0.28"
reqwest = { version = "0.13", features = ["json"] }

# Metrics (alternative)
prometheus = "0.14"

# GraphQL
async-graphql = { version = "7.2", features = ["chrono"] }
async-graphql-axum = "7.2"

# gRPC
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"
tonic-build = "0.14"
prost-build = "0.14"

# Python bindings
pyo3 = { version = "0.27", features = ["auto-initialize"] }

# Compression
zstd = "0.13"
lz4 = "1.28"
lz4_flex = "0.12"
snap = "1.1"
flate2 = "1.1"

# Encryption
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.8", features = ["derive"] }

# Hash algorithms
blake2 = "0.10"
sha3 = "0.10"

# AWS SDK
aws-config = "1.8"
aws-sdk-s3 = "1.120"

# HTTP utilities
url = "2.5"
urlencoding = "2.1"

# Async utilities
tokio-stream = "0.1"
async-stream = "0.3"
futures-util = "0.3"

# CLI utilities
colored = "3.1"
indicatif = "0.18"
toml = "0.9"
dirs = "6.0"
atty = "0.2"
rustyline = "17.0"
ratatui = "0.30"
crossterm = "0.29"
clap_complete = "4.5"
clap_mangen = "0.2"
serde_yaml = "0.9"

# System utilities
sysinfo = "0.37"
fastrand = "2.3"

# Internal IPFRS crates
ipfrs-core = { path = "crates/ipfrs-core", version = "0.1.0" }
ipfrs-storage = { path = "crates/ipfrs-storage", version = "0.1.0" }
ipfrs-network = { path = "crates/ipfrs-network", version = "0.1.0" }
ipfrs-tensorlogic = { path = "crates/ipfrs-tensorlogic", version = "0.1.0" }
ipfrs-transport = { path = "crates/ipfrs-transport", version = "0.1.0" }
ipfrs-semantic = { path = "crates/ipfrs-semantic", version = "0.1.0" }
ipfrs-interface = { path = "crates/ipfrs-interface", version = "0.1.0" }
ipfrs = { path = "crates/ipfrs", version = "0.1.0" }
num_cpus = "1.17"
lazy_static = "1.5"
bytemuck = "1.24"

# Serialization extensions
serde-pickle = "1.2"

# HTTP server extensions
http-body-util = "0.1"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls-pemfile = "2.2"

# Testing extensions
md5 = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.release-arm]
inherits = "release"
# ARM-specific optimizations
# Enable NEON/SVE when available
