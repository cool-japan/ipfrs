[package]
name = "ipfrs-wasm"
version = "0.1.0"
edition = "2021"
authors = ["IPFRS Contributors"]
description = "WebAssembly bindings for IPFRS distributed content-addressed storage system"
keywords = ["ipfs", "wasm", "webassembly", "bindings", "distributed"]
categories = ["api-bindings", "wasm"]
documentation = "https://docs.rs/ipfrs-wasm"
homepage = "https://github.com/cool-japan/ipfrs"
repository = "https://github.com/cool-japan/ipfrs"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# IPFRS core dependencies
ipfrs = { path = "../ipfrs", version = "0.1.0" }
ipfrs-core = { path = "../ipfrs-core", version = "0.1.0" }
ipfrs-semantic = { path = "../ipfrs-semantic", version = "0.1.0" }
ipfrs-tensorlogic = { path = "../ipfrs-tensorlogic", version = "0.1.0" }

# wasm-bindgen for WebAssembly
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# Web APIs
web-sys = { version = "0.3", features = ["console"] }

# Async runtime for WASM
tokio = { version = "1.40", features = ["sync", "macros"], default-features = false }

# Synchronization
parking_lot = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Console error handling
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["console_error_panic_hook"]

[profile.release]
opt-level = "s"  # Optimize for size
lto = true
